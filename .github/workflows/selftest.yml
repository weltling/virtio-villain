# SPDX-License-Identifier: Apache-2.0
name: selftest
on: [push, pull_request]
env:
  REALGCC: gcc-14
jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 musl, the primary target, packs the initramfs too.
          - arch: x86_64
            runner: ubuntu-24.04
            cc: musl-gcc
            pkgs: musl-tools gcc-14
          # aarch64 cross build on the x86_64 runner, compile only.
          - arch: aarch64-cross
            runner: ubuntu-24.04
            cc: aarch64-linux-gnu-gcc-14
            pkgs: gcc-14-aarch64-linux-gnu libc6-dev-arm64-cross
          # aarch64 native build, compile only, no KVM so no run.
          - arch: aarch64-native
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            pkgs: musl-tools gcc-14
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}
      - run: make deps-check CC=${{ matrix.cc }}
      - run: make -j$(nproc) init perf CC=${{ matrix.cc }}
      - run: sh selftest/test_mmio_codegen.sh ${{ matrix.cc }}
        if: matrix.arch == 'aarch64-cross'
      - run: make initramfs CC=${{ matrix.cc }}
        if: matrix.arch == 'x86_64'
  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-14
      # Suite build and appliance checks compile with plain gcc and cc.
      - run: |
          mkdir -p "$RUNNER_TEMP/gcc-14"
          ln -s /usr/bin/gcc-14 "$RUNNER_TEMP/gcc-14/gcc"
          ln -s /usr/bin/gcc-14 "$RUNNER_TEMP/gcc-14/cc"
          echo "$RUNNER_TEMP/gcc-14" >> "$GITHUB_PATH"
      - run: make -j$(nproc)
      - run: make selftest
  sanitize:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc-14
            pkgs: gcc-14
          - cc: clang-19
            pkgs: clang-19
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}
      - run: make selftest-sanitize CC=${{ matrix.cc }}
  fuzz-build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            cc: musl-gcc
            pkgs: musl-tools gcc-14
          - arch: aarch64-cross
            runner: ubuntu-24.04
            cc: aarch64-linux-gnu-gcc-14
            pkgs: gcc-14-aarch64-linux-gnu libc6-dev-arm64-cross
          - arch: aarch64-native
            runner: ubuntu-24.04-arm
            cc: musl-gcc
            pkgs: musl-tools gcc-14
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}
      - run: make fuzz CC=${{ matrix.cc }}
      - run: make fuzz-initramfs CC=${{ matrix.cc }}
        if: matrix.arch == 'x86_64'
      - run: test -f target/fuzz-initramfs.cpio.gz
        if: matrix.arch == 'x86_64'
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flake8
      - run: make flake8
  gitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y python3-pip
      - run: pip install gitlint
      - name: Run gitlint on PR commits
        if: github.event_name == 'pull_request'
        run: gitlint --commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: Run gitlint on last commit
        if: github.event_name == 'push'
        run: gitlint --commits HEAD~1..HEAD
